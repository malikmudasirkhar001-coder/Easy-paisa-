<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ep-green: #00A651;
      --ep-theme-dark: #261f30;
      --ep-bg-gray: #f7f9fa;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #261f30;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }

    /* Top Status Bar */
    .status-bar {
      position: absolute;
      top: 10px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
      z-index: 60;
      pointer-events: none;
    }

    /* STAGE 1: Centered 11.jpeg (Strictly 3.0s Stay) */
    #splash-stage-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background-color: #261f30;
      animation: hideStage1 0.35s ease 3s forwards;
      pointer-events: none;
    }
    @keyframes hideStage1 {
      0% { opacity: 1; visibility: visible; }
      99% { opacity: 0; visibility: visible; }
      100% { opacity: 0; visibility: hidden; display: none; }
    }
    .center-logo-box {
      width: 175px;
      height: 175px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .center-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* STAGE 2: Splash Rings & Motion Sequence */
    #splash-stage-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      animation: showStage2 0.4s ease 3s forwards;
    }
    @keyframes showStage2 {
      to { opacity: 1; }
    }

    .stage2-content {
      position: relative;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-15px);
      animation: slideLeftToRight 0.65s cubic-bezier(0.2, 0.8, 0.3, 1) 3.2s forwards;
    }
    @keyframes slideLeftToRight {
      from { transform: translateX(20px); opacity: 0.5; }
      to { transform: translateX(-40px); opacity: 1; }
    }

    .red-filter-logo {
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
    }
    .red-filter-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-type-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      animation: revealTypeContainer 0.2s ease 3.8s forwards;
    }
    @keyframes revealTypeContainer {
      to { opacity: 1; }
    }

    .brand-text-row {
      display: flex;
      align-items: baseline;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      line-height: 0.94;
      color: #ffffff;
      letter-spacing: -2px;
      min-height: 42px;
    }

    #row-bank {
      transform: translateY(-8px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.3s ease;
    }
    #row-bank.bank-flow-down {
      transform: translateY(0);
      opacity: 1;
    }

    .char-code {
      display: inline-block;
      font-family: monospace;
      font-weight: 800;
      font-size: 38px;
      color: #00A651;
      text-shadow: 0 0 10px rgba(0, 166, 81, 0.7);
    }
    .char-solid {
      display: inline-block;
      color: #ffffff;
    }

    /* Orbit Rings */
    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }
    .orbit-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 38s linear infinite;
      transform-origin: 300px 300px;
    }
    .orbit-ring-outer {
      animation: spinCounter 50s linear infinite;
      transform-origin: 300px 300px;
    }

    /* HOME SCREEN */
    #screen-home {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--ep-bg-gray);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding-bottom: 74px;
    }
    #screen-home.active-home {
      opacity: 1;
      pointer-events: auto;
      z-index: 40;
    }
    #screen-home::-webkit-scrollbar { display: none; }

    /* User Greeting Bar */
    .user-header-bar {
      padding: 16px 20px 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ep-bg-gray);
      margin-top: 24px;
    }
    .user-meta-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #a5b4fc;
      color: #1e1b4b;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .user-greet-text {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
    }
    .notif-bell-icon {
      font-size: 22px;
      color: #334155;
    }

    /* Ello Search Bar */
    .search-wrap-ello {
      padding: 6px 18px 12px 18px;
    }
    .search-input-box {
      width: 100%;
      height: 46px;
      background: #ffffff;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .ello-badge-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .search-placeholder-text {
      font-size: 14px;
      color: #475569;
      font-weight: 500;
    }

    /* Cards Horizontal Container */
    .cards-slider-container {
      display: flex;
      gap: 12px;
      padding: 6px 18px 16px 18px;
      overflow-x: auto;
    }
    .cards-slider-container::-webkit-scrollbar { display: none; }

    .card-ep-account {
      flex: 0 0 240px;
      height: 185px;
      background: linear-gradient(145deg, #a7f3d0 0%, #6ee7b7 45%, #34d399 100%);
      border-radius: 26px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 8px 20px rgba(52, 211, 153, 0.25);
    }
    .card-top-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .box-3d-graphic {
      width: 60px;
      height: 45px;
      background: #059669;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      border: 2px solid #34d399;
    }
    .coin-3d-gold {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fde047;
      border-radius: 50%;
      border: 2px solid #ca8a04;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #854d0e;
    }
    .account-title-tag {
      font-size: 15px;
      font-weight: 700;
      color: #064e3b;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .signin-main-bold {
      font-size: 26px;
      font-weight: 800;
      color: #064e3b;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .account-mask-number {
      font-size: 12px;
      color: #047857;
      font-weight: 600;
    }

    .card-borrow-loan {
      flex: 0 0 170px;
      height: 185px;
      background: linear-gradient(145deg, #fef08a, #fde047);
      border-radius: 26px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #713f12;
      box-shadow: 0 8px 18px rgba(253, 224, 71, 0.25);
    }

    /* 9-BOX SERVICES GRID (PURE IMAGE BUTTONS - NO TEXT LABELS) */
    .services-main-wrapper {
      padding: 0 18px 24px 18px;
    }
    .section-title-label {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 14px;
    }
    .services-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* کلک ایبل سروس بٹن جس پر تصویر پرفیکٹ فٹ ہوگی اور ٹیکسٹ شو نہیں ہوگا */
    .service-btn-tile {
      background: #ffffff;
      border-radius: 20px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #f1f5f9;
      cursor: pointer;
      overflow: hidden;
      outline: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .service-btn-tile:active {
      transform: scale(0.96);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .service-btn-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Indicator Dots */
    .slider-dots-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
    }
    .dot-bullet {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .dot-bullet.active-dot {
      background: var(--ep-green);
    }

    /* Bottom Navigation Bar */
    .bottom-navbar-fixed {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 50;
    }
    .nav-item-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      width: 52px;
      height: 100%;
    }
    .nav-item-unit img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .nav-pay-btn-custom {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--ep-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -16px;
      box-shadow: 0 4px 12px rgba(0, 166, 81, 0.4);
      border: none;
      cursor: pointer;
      overflow: hidden;
      padding: 8px;
    }
    .nav-pay-btn-custom img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
  </style>
</head>
<body>

  <div id="phone-frame">

    <div class="status-bar">
      <span>1:05</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <span>37%</span>
      </div>
    </div>

    <!-- 1. STAGE 1: Centered 11.jpeg (Strictly 3s) -->
    <div id="splash-stage-1">
      <div class="center-logo-box">
        <img src="11.jpeg" alt="Logo 1">
      </div>
    </div>

    <!-- 2. STAGE 2: Slide + Balanced Circles + Matrix Typography -->
    <div id="splash-stage-2">
      
      <div class="orbit-container">
        <svg class="orbit-svg" viewBox="0 0 600 600">
          <defs>
            <path id="innerCirclePath" d="M 300, 300 m -145, 0 a 145,145 0 1,1 290,0 a 145,145 0 1,1 -290,0" fill="none" />
            <path id="outerCirclePath" d="M 300, 300 m -240, 0 a 240,240 0 1,1 480,0 a 240,240 0 1,1 -480,0" fill="none" />
          </defs>

          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Comfortaa', sans-serif" font-size="16" font-weight="500" letter-spacing="3.2">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Comfortaa', sans-serif" font-size="17" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <div class="stage2-content">
        <div class="red-filter-logo">
          <svg viewBox="0 0 120 120">
            <ellipse cx="60" cy="46" rx="42" ry="32" fill="#ffffff"/>
            <ellipse cx="60" cy="47" rx="22" ry="14" fill="#261f30"/>
            <path d="M 18 50 C 20 76 44 96 68 96 C 88 96 102 85 102 85 L 96 73 C 96 73 83 82 66 82 C 45 82 32 68 28 50 Z" fill="#00A651" />
          </svg>
        </div>

        <div id="brand-type-wrap" class="brand-type-wrap">
          <div id="row-digital" class="brand-text-row"></div>
          <div id="row-bank" class="brand-text-row"></div>
        </div>
      </div>

    </div>

    <!-- 3. EXACT HOME SCREEN -->
    <div id="screen-home">
      
      <!-- User Greeting Bar -->
      <div class="user-header-bar">
        <div class="user-meta-left">
          <div class="user-avatar-circle">MA</div>
          <span class="user-greet-text">Hey There 👋</span>
        </div>
        <i class="fa-regular fa-bell notif-bell-icon"></i>
      </div>

      <!-- Ello Search Bar -->
      <div class="search-wrap-ello">
        <div class="search-input-box">
          <div class="ello-badge-avatar">🦁</div>
          <span class="search-placeholder-text">Search or Ask Ello</span>
        </div>
      </div>

      <!-- Account & Loan Cards Slider -->
      <div class="cards-slider-container">
        <!-- 1. Green easypaisa Account Card -->
        <div class="card-ep-account">
          <div>
            <div class="card-top-icon-wrap">
              <div class="box-3d-graphic">
                <div class="coin-3d-gold" style="top: -6px; left: 10px;">e</div>
                <div class="coin-3d-gold" style="top: 8px; left: 24px;">e</div>
              </div>
            </div>
            <div class="account-title-tag">
              <span>easypaisa Account</span>
              <i class="fa-solid fa-chevron-down" style="font-size: 11px;"></i>
            </div>
          </div>
          <div>
            <div class="signin-main-bold">Sign in</div>
            <div class="account-mask-number">*******7662</div>
          </div>
        </div>

        <!-- 2. Yellow Borrow Money Card -->
        <div class="card-borrow-loan">
          <div>
            <div style="font-size: 13px; font-weight: 800; text-transform: uppercase;">Borrow Money</div>
            <div style="font-size: 16px; font-weight: 800; margin-top: 8px; line-height: 1.2;">
              Get up to<br><span style="font-size: 21px;">50,000</span>
            </div>
          </div>
          <div style="font-size: 11px; font-weight: 700; color: #854d0e;">Instant Loan &rarr;</div>
        </div>
      </div>

      <!-- Services Grid (Loaded from icons.json - Images Only, No Text Labels) -->
      <div class="services-main-wrapper">
        <h3 class="section-title-label">More with easypaisa</h3>
        <div class="services-cards-grid" id="services-grid-container">
          <!-- Dynamic pure image buttons render here -->
        </div>

        <div class="slider-dots-center">
          <span class="dot-bullet active-dot"></span>
          <span class="dot-bullet"></span>
        </div>
      </div>

      <!-- Bottom Navigation Bar (Home, Cards, Pay Set to Your Images) -->
      <nav class="bottom-navbar-fixed">
        <button class="nav-item-unit" id="nav-btn-home" aria-label="Home" onclick="onNavClick('home')">
          <img id="nav-img-home" src="https://i.ibb.co/PGD4tQK5/139526.jpg" alt="">
          <span>Home</span>
        </button>
        <button class="nav-item-unit" id="nav-btn-cards" aria-label="Cards" onclick="onNavClick('cards')">
          <img id="nav-img-cards" src="https://i.ibb.co/Tx5fqRJR/139527.jpg" alt="">
          <span>Cards</span>
        </button>
        <button class="nav-pay-btn-custom" id="nav-btn-pay" aria-label="Pay" onclick="onNavClick('pay')">
          <img id="nav-img-pay" src="https://i.ibb.co/rRDf8PBz/139528.jpg" alt="">
        </button>
        <button class="nav-item-unit" aria-label="Promotions" onclick="onNavClick('promotions')">
          <i class="fa-solid fa-tags" style="font-size: 20px;"></i>
          <span>Promotions</span>
        </button>
        <button class="nav-item-unit" aria-label="Zen" onclick="onNavClick('zen')">
          <i class="fa-solid fa-circle-nodes" style="font-size: 20px;"></i>
          <span>Zen</span>
        </button>
      </nav>

    </div>

  </div>

  <script>
    // سروس بٹن پر کلک کا فنکشن
    function onServiceClick(serviceId, serviceName) {
      console.log("Clicked Service:", serviceId, serviceName);
    }

    // نیویگیشن بٹن کلک ہینڈلر
    function onNavClick(navId) {
      console.log("Nav clicked:", navId);
    }

    // icons.json سے تصاویر فیچ کر کے بغیر کسی ٹیکسٹ کے فٹ کرنے کا فنکشن
    async function loadIconsFromJSON() {
      const container = document.getElementById('services-grid-container');
      
      // آپ کے مہیا کردہ 9 سروس امیج لنکس کا ڈیفالٹ ڈیٹا (اگر لوکل فائل لوڈنگ بلاک ہو تو یہ فوراً رینڈر کرے گا)
      const defaultData = [
        { id: "send_money", name: "Send money", image: "https://i.ibb.co/HfTnHM4y/139517.jpg" },
        { id: "bill_payment", name: "Bill payment", image: "https://i.ibb.co/xqWkXLqB/139518.jpg" },
        { id: "load_packages", name: "Load packages", image: "https://i.ibb.co/Zp3VvGHH/139519.jpg" },
        { id: "enter_in_win", name: "Enter in win", image: "https://i.ibb.co/R4d4xcsW/139520.jpg" },
        { id: "easy_cash", name: "Easy cahs", image: "https://i.ibb.co/Qjpqzd6F/139521.jpg" },
        { id: "term_deposit", name: "Term deposit", image: "https://i.ibb.co/B2Hqtjp6/139522.jpg" },
        { id: "insurance", name: "Insurance", image: "https://i.ibb.co/ZpYTBzkn/139523.jpg" },
        { id: "rs1_game", name: "Rd.1 game", image: "https://i.ibb.co/ccszj3QF/139524.jpg" },
        { id: "see_all", name: "See all", image: "https://i.ibb.co/XrSfSYff/139525.jpg" }
      ];

      function renderGrid(servicesList) {
        container.innerHTML = '';
        servicesList.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'service-btn-tile';
          btn.setAttribute('data-id', item.id);
          btn.setAttribute('data-name', item.name); // نام صرف اندرونی ویلیو کے لیے
          btn.setAttribute('aria-label', item.name);
          btn.onclick = () => onServiceClick(item.id, item.name);

          btn.innerHTML = `<img src="${item.image}" alt="">`;
          container.appendChild(btn);
        });
      }

      try {
        const response = await fetch('icons.json');
        const data = await response.json();
        if (data.services && data.services.length > 0) {
          renderGrid(data.services);
        } else {
          renderGrid(defaultData);
        }

        // باٹم بار کے لنکس
        if (data.bottom_nav) {
          if (data.bottom_nav.home) document.getElementById('nav-img-home').src = data.bottom_nav.home;
          if (data.bottom_nav.cards) document.getElementById('nav-img-cards').src = data.bottom_nav.cards;
          if (data.bottom_nav.pay) document.getElementById('nav-img-pay').src = data.bottom_nav.pay;
        }
      } catch (e) {
        renderGrid(defaultData);
      }
    }

    const codeMatrixPool = ["0", "1", "Q", "I", "l", "o", "d", "b"];

    function animateToFinalWord(container, word, onComplete) {
      let step = 0;
      const interval = setInterval(() => {
        if (step <= word.length) {
          let html = '';
          for (let i = 0; i < step; i++) {
            html += `<span class="char-solid">${word[i]}</span>`;
          }
          if (step < word.length) {
            const rnd = codeMatrixPool[Math.floor(Math.random() * codeMatrixPool.length)];
            html += `<span class="char-code">${rnd}</span>`;
          }
          container.innerHTML = html;
          step++;
        } else {
          clearInterval(interval);
          container.innerHTML = `<span class="char-solid">${word}</span>`;
          if (onComplete) onComplete();
        }
      }, 45);
    }

    // اینیمیشن تسلسل: digital -> bank -> Show Home Screen
    setTimeout(() => {
      const rowDigital = document.getElementById('row-digital');
      const rowBank = document.getElementById('row-bank');

      animateToFinalWord(rowDigital, "digital", () => {
        setTimeout(() => {
          rowBank.classList.add('bank-flow-down');
          animateToFinalWord(rowBank, "bank", () => {
            setTimeout(() => {
              const home = document.getElementById('screen-home');
              if (home) home.classList.add('active-home');
            }, 600);
          });
        }, 50);
      });
    }, 3900);

    window.addEventListener('DOMContentLoaded', () => {
      loadIconsFromJSON();
    });
  </script>
</body>
</html>
