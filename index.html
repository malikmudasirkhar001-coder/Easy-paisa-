<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ep-green: #00A651;
      --ep-theme-dark: #261f30;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #261f30;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }

    /* Top Status Bar */
    .status-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      z-index: 60;
      pointer-events: none;
    }

    /* STAGE 1: Centered 11.jpeg (Strictly 3s CSS Animation) */
    #splash-stage-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background-color: #261f30;
      animation: stage1FadeOut 0.4s ease 3s forwards;
      pointer-events: none;
    }
    @keyframes stage1FadeOut {
      0% { opacity: 1; visibility: visible; }
      99% { opacity: 0; visibility: visible; }
      100% { opacity: 0; visibility: hidden; display: none; }
    }
    .center-logo-box {
      width: 175px;
      height: 175px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .center-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* STAGE 2: Splash Rings & Brand Typewriter */
    #splash-stage-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      animation: stage2FadeIn 0.4s ease 3s forwards;
    }
    @keyframes stage2FadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Slide Group */
    .stage2-content {
      position: relative;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(0px);
      animation: slideLeftAnim 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) 3.3s forwards;
    }
    @keyframes slideLeftAnim {
      from { transform: translateX(0px); }
      to { transform: translateX(-40px); }
    }

    .pure-vector-logo {
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
    }
    .pure-vector-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-type-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      animation: showTypeBox 0.2s ease 3.8s forwards;
    }
    @keyframes showTypeBox {
      to { opacity: 1; }
    }

    .brand-text-row {
      display: flex;
      align-items: baseline;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      line-height: 0.94;
      color: #ffffff;
      letter-spacing: -2px;
      min-height: 42px;
    }
    .char-code {
      display: inline-block;
      font-family: monospace;
      font-weight: 800;
      font-size: 38px;
      color: #00A651;
      text-shadow: 0 0 10px rgba(0, 166, 81, 0.7);
    }
    .char-solid {
      display: inline-block;
      color: #ffffff;
    }

    /* Orbit SVG Rings */
    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }
    .orbit-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 38s linear infinite;
      transform-origin: 300px 300px;
    }
    .orbit-ring-outer {
      animation: spinCounter 50s linear infinite;
      transform-origin: 300px 300px;
    }

    /* HOME SCREEN */
    #screen-home {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #f6f7f9;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding-bottom: 74px;
    }
    #screen-home.active-home {
      opacity: 1;
      pointer-events: auto;
      z-index: 40;
    }
    #screen-home::-webkit-scrollbar { display: none; }

    .home-top-bar {
      padding: 16px 16px 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      font-family: 'Inter', sans-serif;
    }
    .search-box-ello {
      flex: 1;
      height: 44px;
      background: #f1f4f8;
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }
    .ello-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .home-cards-scroll {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      overflow-x: auto;
      font-family: 'Inter', sans-serif;
    }
    .home-cards-scroll::-webkit-scrollbar { display: none; }

    .card-easypaisa {
      flex: 0 0 220px;
      height: 140px;
      background: linear-gradient(135deg, #00A651, #008a43);
      border-radius: 20px;
      padding: 16px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 16px rgba(0, 166, 81, 0.25);
    }
    .card-loan {
      flex: 0 0 170px;
      height: 140px;
      background: linear-gradient(135deg, #fef9c3, #fef08a);
      border-radius: 20px;
      padding: 16px;
      color: #713f12;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .services-section {
      background: #ffffff;
      margin: 8px 16px 20px 16px;
      border-radius: 24px;
      padding: 16px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-family: 'Inter', sans-serif;
    }
    .services-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 14px;
      padding-left: 6px;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      text-align: center;
    }
    .service-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .service-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #00A651;
      border: 1px solid #edf2f7;
    }
    .service-label {
      font-size: 10.5px;
      font-weight: 600;
      color: #475569;
      line-height: 1.2;
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      z-index: 50;
      font-family: 'Inter', sans-serif;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-btn.active { color: #00A651; }
    .nav-btn i { font-size: 18px; }
    .nav-pay-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00A651;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-top: -16px;
      box-shadow: 0 4px 12px rgba(0, 166, 81, 0.4);
    }
  </style>
</head>
<body>

  <div id="phone-frame">

    <div class="status-bar">
      <span>5:55</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <span>84%</span>
      </div>
    </div>

    <!-- 1. STAGE 1: Centered 11.jpeg (Strictly 3s Auto-Fading) -->
    <div id="splash-stage-1">
      <div class="center-logo-box">
        <img src="11.jpeg" alt="Logo 1">
      </div>
    </div>

    <!-- 2. STAGE 2: Slide + Balanced Side Cutting Circles + Bold Typography -->
    <div id="splash-stage-2">
      
      <div class="orbit-container">
        <svg class="orbit-svg" viewBox="0 0 600 600">
          <defs>
            <path id="innerCirclePath" d="M 300, 300 m -145, 0 a 145,145 0 1,1 290,0 a 145,145 0 1,1 -290,0" fill="none" />
            <path id="outerCirclePath" d="M 300, 300 m -240, 0 a 240,240 0 1,1 480,0 a 240,240 0 1,1 -480,0" fill="none" />
          </defs>

          <!-- Inner Ring -->
          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Comfortaa', sans-serif" font-size="16" font-weight="500" letter-spacing="3.2">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <!-- Outer Ring -->
          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Comfortaa', sans-serif" font-size="17" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- مرکزی کمپوزیشن: 'e' لوگو + ڈیجیٹل بینک -->
      <div class="stage2-content">
        <div class="pure-vector-logo">
          <svg viewBox="0 0 120 120">
            <ellipse cx="60" cy="46" rx="42" ry="32" fill="#ffffff"/>
            <ellipse cx="60" cy="47" rx="22" ry="14" fill="#261f30"/>
            <path d="M 18 50 C 20 76 44 96 68 96 C 88 96 102 85 102 85 L 96 73 C 96 73 83 82 66 82 C 45 82 32 68 28 50 Z" fill="#00A651" />
          </svg>
        </div>

        <div id="brand-type-wrap" class="brand-type-wrap">
          <div id="row-digital" class="brand-text-row"></div>
          <div id="row-bank" class="brand-text-row"></div>
        </div>
      </div>

    </div>

    <!-- 3. HOME SCREEN -->
    <div id="screen-home">
      
      <div class="home-top-bar">
        <div class="search-box-ello">
          <div class="ello-badge">🦁</div>
          <span>Search or Ask Ello</span>
        </div>
      </div>

      <div class="home-cards-scroll">
        <div class="card-easypaisa">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:12px; font-weight:700;">easypaisa Account <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></span>
            </div>
            <h2 style="font-size:22px; font-weight:800; margin-top:14px; letter-spacing:-0.5px;">Sign in</h2>
          </div>
          <span style="font-size:11px; opacity:0.85; font-weight:600;">*******7662</span>
        </div>

        <div class="card-loan">
          <div>
            <span style="font-size:11px; font-weight:800; text-transform:uppercase;">Borrow Money</span>
            <h3 style="font-size:15px; font-weight:900; margin-top:8px; line-height:1.2;">Get up to<br><span style="font-size:19px;">50,000</span></h3>
          </div>
          <span style="font-size:10px; font-weight:700; color:#854d0e;">Instant Loan &rarr;</span>
        </div>
      </div>

      <div class="services-section">
        <h4 class="services-title">More with easypaisa</h4>
        
        <div class="services-grid">
          <div class="service-item">
            <div class="service-icon-box"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
            <span class="service-label">Send Money</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#d97706;"><i class="fa-solid fa-receipt"></i></div>
            <span class="service-label">Bill Payment</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#2563eb;"><i class="fa-solid fa-mobile-screen"></i></div>
            <span class="service-label">Loads & Packages</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#e11d48;"><i class="fa-solid fa-gift"></i></div>
            <span class="service-label">Enter and Win</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#16a34a;"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <span class="service-label">Easycash</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#9333ea;"><i class="fa-solid fa-piggy-bank"></i></div>
            <span class="service-label">Term Deposit</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#0284c7;"><i class="fa-solid fa-shield-heart"></i></div>
            <span class="service-label">Insurance</span>
          </div>

          <div class="service-item">
            <div class="service-icon-box" style="color:#ea580c;"><i class="fa-solid fa-trophy"></i></div>
            <span class="service-label">Rs. 1 Game</span>
          </div>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; gap:4px; margin-top:14px;">
          <span style="width:6px; height:6px; border-radius:50%; background:#00A651;"></span>
          <span style="width:6px; height:6px; border-radius:50%; background:#cbd5e1;"></span>
        </div>
      </div>

      <nav class="bottom-bar">
        <button class="nav-btn active">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </button>
        <button class="nav-btn">
          <i class="fa-solid fa-credit-card"></i>
          <span>Cards</span>
        </button>
        <button class="nav-btn">
          <div class="nav-pay-btn">
            <i class="fa-solid fa-qrcode"></i>
          </div>
          <span>Pay</span>
        </button>
        <button class="nav-btn">
          <i class="fa-solid fa-tags"></i>
          <span>Promotions</span>
        </button>
        <button class="nav-btn">
          <i class="fa-solid fa-circle-nodes"></i>
          <span>Zen</span>
        </button>
      </nav>

    </div>

  </div>

  <script>
    const codeMatrixPool = ["0", "1", "Q", "I", "l", "o", "d", "b"];

    function animateToFinalWord(container, word, onComplete) {
      let step = 0;
      const interval = setInterval(() => {
        if (step <= word.length) {
          let html = '';
          for (let i = 0; i < step; i++) {
            html += `<span class="char-solid">${word[i]}</span>`;
          }
          if (step < word.length) {
            const rnd = codeMatrixPool[Math.floor(Math.random() * codeMatrixPool.length)];
            html += `<span class="char-code">${rnd}</span>`;
          }
          container.innerHTML = html;
          step++;
        } else {
          clearInterval(interval);
          container.innerHTML = `<span class="char-solid">${word}</span>`;
          if (onComplete) onComplete();
        }
      }, 45);
    }

    // سی ایس ایس اینیمیشن کے ساتھ سنکرونائزڈ ٹائپنگ
    setTimeout(() => {
      const rowDigital = document.getElementById('row-digital');
      const rowBank = document.getElementById('row-bank');

      animateToFinalWord(rowDigital, "digital", () => {
        setTimeout(() => {
          animateToFinalWord(rowBank, "bank", () => {
            // ٹائپنگ ختم ہوتے ہی سیدھا ہوم پیج فعال
            setTimeout(() => {
              const home = document.getElementById('screen-home');
              if (home) home.classList.add('active-home');
            }, 600);
          });
        }, 40);
      });
    }, 3900);
  </script>
</body>
</html>
