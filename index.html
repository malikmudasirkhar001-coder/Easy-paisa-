<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ep-green: #00A651;
      --ep-dark-green: #008a43;
      --ep-theme-dark: #261f30;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #261f30;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      background-color: #f8fafc;
      overflow-y: auto;
      z-index: 10;
    }
    .screen.on {
      display: flex;
    }

    /* SPLASH SCREEN STYLES */
    #screen-splash {
      background-color: #261f30;
      align-items: center;
      justify-content: center;
    }
    .status-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      z-index: 50;
      pointer-events: none;
    }

    /* STAGE 1: Exact Size White Square Box (Matching Image) */
    #splash-stage-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .exact-photo-box {
      width: 175px;
      height: 175px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .exact-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* STAGE 2: Slide to Left + Rings + Typewriter */
    #splash-stage-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }
    .stage2-content {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }
    .left-logo-wrap {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .left-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .typewriter-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 170px;
    }
    .typewriter-line {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      min-height: 36px;
    }

    /* Orbit SVG Rings */
    .orbit-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 36s linear infinite;
      transform-origin: 250px 250px;
    }
    .orbit-ring-outer {
      animation: spinCounter 48s linear infinite;
      transform-origin: 250px 250px;
    }

    /* Typewriter Caret */
    @keyframes cursorPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-caret {
      display: inline-block;
      width: 3.5px;
      height: 0.9em;
      background-color: #00A651;
      margin-left: 3px;
      animation: cursorPulse 0.5s infinite;
      vertical-align: middle;
    }

    /* Keypad Styles */
    .key-btn {
      height: 56px;
      border-radius: 16px;
      background-color: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .key-btn:active {
      transform: scale(0.94);
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div id="phone-frame">

    <!-- 1. SPLASH SCREEN -->
    <div id="screen-splash" class="screen on">
      
      <!-- Top Mobile Status Bar -->
      <div class="status-bar">
        <span>5:55</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <span>84%</span>
        </div>
      </div>

      <!-- STAGE 1: Exact Size White Square Box (Matching Screenshot, 3 Seconds Fix) -->
      <div id="splash-stage-1">
        <div class="exact-photo-box">
          <img id="img-11" src="11.png" alt="Easypaisa Logo 1" 
               onerror="this.onerror=null; this.src='https://i.ibb.co/Lh0H11BY/138526.png';">
        </div>
      </div>

      <!-- STAGE 2: Left Side Logo + Typewriter Digital Bank + Distant Rings -->
      <div id="splash-stage-2">
        
        <!-- Distant Concentric Rings -->
        <svg class="orbit-svg" viewBox="0 0 500 500">
          <defs>
            <path id="innerCirclePath" d="M 250, 250 m -165, 0 a 165,165 0 1,1 330,0 a 165,165 0 1,1 -330,0" fill="none" />
            <path id="outerCirclePath" d="M 250, 250 m -225, 0 a 225,225 0 1,1 450,0 a 225,225 0 1,1 -450,0" fill="none" />
          </defs>

          <!-- Inner Ring -->
          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="500" letter-spacing="3.5">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <!-- Outer Ring -->
          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Space Grotesk', sans-serif" font-size="15.5" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>

        <!-- Center Unit: Left Logo + Typewriter -->
        <div class="stage2-content">
          <div class="left-logo-wrap">
            <img id="img-2" src="2.png" alt="Easypaisa Logo 2" 
                 onerror="this.onerror=null; this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5m42bkv91DtBj9AXA3R104H_yaItfi63HEg&s';">
          </div>

          <div class="typewriter-box">
            <span id="typed-line-1" class="typewriter-line"></span>
            <span id="typed-line-2" class="typewriter-line"></span>
          </div>
        </div>

      </div>

    </div>

    <!-- 2. LOGIN SCREEN (Direct Transition) -->
    <div id="screen-login" class="screen" style="justify-content:space-between; padding:24px; background:#ffffff;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding-top:16px;">
        <div style="width:32px;"></div>
        <span style="font-size:12px; font-weight:700; color:#94a3b8; letter-spacing:0.1em; text-transform:uppercase;">Secure Sign In</span>
        <div style="width:32px;"></div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 0;">
        <div style="width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg, #008a43, #00A651); display:flex; align-items:center; justify-content:center; color:#ffffff; box-shadow:0 10px 20px rgba(0,166,81,0.25); margin-bottom:16px;">
          <i class="fa-solid fa-lock" style="font-size:24px;"></i>
        </div>
        <h2 style="font-size:20px; font-weight:800; color:#1e293b;">Enter Your 5-Digit PIN</h2>
        <p style="font-size:12px; color:#64748b; margin-top:4px;">Easypaisa Account: 0312-9876543</p>

        <!-- PIN Dots indicator -->
        <div style="display:flex; gap:14px; margin-top:24px; margin-bottom:8px;">
          <div id="dot-0" style="width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; background:transparent;"></div>
          <div id="dot-1" style="width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; background:transparent;"></div>
          <div id="dot-2" style="width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; background:transparent;"></div>
          <div id="dot-3" style="width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; background:transparent;"></div>
          <div id="dot-4" style="width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; background:transparent;"></div>
        </div>
        <span id="pin-feedback" style="font-size:12px; font-weight:600; color:#f43f5e; height:18px;"></span>
      </div>

      <!-- Keypad -->
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; max-width:280px; margin:0 auto; padding-bottom:16px;">
        <button onclick="pin('1')" class="key-btn">1</button>
        <button onclick="pin('2')" class="key-btn">2</button>
        <button onclick="pin('3')" class="key-btn">3</button>
        <button onclick="pin('4')" class="key-btn">4</button>
        <button onclick="pin('5')" class="key-btn">5</button>
        <button onclick="pin('6')" class="key-btn">6</button>
        <button onclick="pin('7')" class="key-btn">7</button>
        <button onclick="pin('8')" class="key-btn">8</button>
        <button onclick="pin('9')" class="key-btn">9</button>
        <button onclick="pinClear()" class="key-btn" style="background:#f1f5f9; font-size:12px; color:#475569;">CLR</button>
        <button onclick="pin('0')" class="key-btn">0</button>
        <button onclick="pinDel()" class="key-btn" style="background:#f1f5f9; color:#475569;">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>
    </div>

    <!-- 3. HOME SCREEN -->
    <div id="screen-home" class="screen" style="padding-bottom:80px;">
      <div style="background:linear-gradient(135deg, #008a43, #00A651); color:#ffffff; padding:20px; border-bottom-left-radius:28px; border-bottom-right-radius:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:24px; font-weight:900; letter-spacing:-0.05em;">easypaisa</span>
            <span style="background:#facc15; color:#1e293b; font-size:9px; font-weight:800; padding:2px 6px; border-radius:999px; text-transform:uppercase;">Bank</span>
          </div>
        </div>

        <div style="margin-top:20px; background:rgba(255,255,255,0.15); border-radius:20px; padding:16px; border:1px solid rgba(255,255,255,0.2);">
          <span style="font-size:12px; color:#ecfdf5;">Easypaisa Available Balance</span>
          <div style="font-size:26px; font-weight:900; margin-top:4px;">Rs. 7,000.00</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let pinStr = '';

    function runSplashSequence() {
      const stage1 = document.getElementById('splash-stage-1');
      const stage2 = document.getElementById('splash-stage-2');
      const line1 = document.getElementById('typed-line-1');
      const line2 = document.getElementById('typed-line-2');

      // 1. Stage 1: Exactly 3.0 Seconds (3000ms)
      setTimeout(() => {
        stage1.style.opacity = '0';
        setTimeout(() => {
          stage1.style.display = 'none';
        }, 500);

        // 2. Stage 2: Reveal Left Logo + Rings + Typewriter starts
        stage2.style.opacity = '1';

        const word1 = "digital";
        const word2 = "bank";
        let i = 0;
        let j = 0;

        const typeInterval = setInterval(() => {
          if (i < word1.length) {
            line1.innerHTML = word1.slice(0, i + 1) + '<span class="cursor-caret"></span>';
            i++;
          } else if (j < word2.length) {
            line1.innerHTML = word1;
            line2.innerHTML = word2.slice(0, j + 1) + '<span class="cursor-caret"></span>';
            j++;
          } else {
            clearInterval(typeInterval);
            line2.innerHTML = word2;

            // 3. Exactly 1.5 seconds after typing, go to LOGIN SCREEN
            setTimeout(() => {
              go('screen-login');
            }, 1500);
          }
        }, 130);

      }, 3000);
    }

    function go(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('on');
      }
    }

    function pin(val) {
      if (pinStr.length >= 5) return;
      pinStr += val;
      updatePinDots();

      if (pinStr.length === 5) {
        setTimeout(verifyPin, 180);
      }
    }

    function pinDel() {
      if (pinStr.length > 0) {
        pinStr = pinStr.slice(0, -1);
        updatePinDots();
        document.getElementById('pin-feedback').innerText = '';
      }
    }

    function pinClear() {
      pinStr = '';
      updatePinDots();
      document.getElementById('pin-feedback').innerText = '';
    }

    function updatePinDots() {
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < pinStr.length) {
          dot.style.background = '#00A651';
          dot.style.borderColor = '#00A651';
        } else {
          dot.style.background = 'transparent';
          dot.style.borderColor = '#cbd5e1';
        }
      }
    }

    function verifyPin() {
      const feedback = document.getElementById('pin-feedback');

      if (pinStr === '32303') {
        pinClear();
        go('screen-home');
        return;
      }

      feedback.innerText = 'Incorrect PIN. Try 32303';
      setTimeout(() => {
        pinClear();
      }, 700);
    }

    window.addEventListener('DOMContentLoaded', () => {
      runSplashSequence();
    });
  </script>
</body>
</html>
