<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ep-green: #00A651;
      --ep-dark-green: #008a43;
      --ep-theme-dark: #261f30;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #261f30;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      background-color: #f8fafc;
      overflow-y: auto;
      z-index: 10;
    }
    .screen.on {
      display: flex;
    }

    /* SPLASH SCREEN STYLES */
    #screen-splash {
      background-color: #261f30;
      align-items: center;
      justify-content: center;
    }
    .status-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      z-index: 50;
      pointer-events: none;
    }

    /* STAGE 1: Centered 11.jpeg (3 Seconds Stay) */
    #splash-stage-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .center-logo-box {
      width: 175px;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* STAGE 2: Slide Container */
    #splash-stage-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
    }

    /* متوازن اور ہلکی سی بائیں موومنٹ */
    .stage2-content {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(0px);
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .stage2-content.shifted {
      transform: translateX(-36px); /* متوازن شفٹ */
    }

    /* شفاف 'e' لوگو کنٹینر */
    .pure-e-logo {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      background: transparent;
    }
    .pure-e-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .typewriter-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 155px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .typewriter-box.active {
      opacity: 1;
    }
    .typewriter-line {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      min-height: 34px;
    }

    /* Orbit SVG Rings */
    .orbit-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 36s linear infinite;
      transform-origin: 250px 250px;
    }
    .orbit-ring-outer {
      animation: spinCounter 48s linear infinite;
      transform-origin: 250px 250px;
    }

    /* Typewriter Cursor */
    @keyframes cursorPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-caret {
      display: inline-block;
      width: 3px;
      height: 0.9em;
      background-color: #00A651;
      margin-left: 2px;
      animation: cursorPulse 0.5s infinite;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <div id="phone-frame">

    <!-- 1. SPLASH SCREEN -->
    <div id="screen-splash" class="screen on">
      
      <div class="status-bar">
        <span>5:55</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <span>84%</span>
        </div>
      </div>

      <!-- STAGE 1: 11.jpeg (پورا 3 سیکنڈ سینٹر میں) -->
      <div id="splash-stage-1">
        <div class="center-logo-box">
          <img src="11.jpeg" alt="Logo 1">
        </div>
      </div>

      <!-- STAGE 2: صرف شفاف 'e' لوگو + ٹائپ رائٹر + سرکلز -->
      <div id="splash-stage-2">
        
        <!-- Background Orbit Rings -->
        <svg class="orbit-svg" viewBox="0 0 500 500">
          <defs>
            <path id="innerCirclePath" d="M 250, 250 m -165, 0 a 165,165 0 1,1 330,0 a 165,165 0 1,1 -330,0" fill="none" />
            <path id="outerCirclePath" d="M 250, 250 m -225, 0 a 225,225 0 1,1 450,0 a 225,225 0 1,1 -450,0" fill="none" />
          </defs>

          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="500" letter-spacing="3.5">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Space Grotesk', sans-serif" font-size="15.5" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>

        <!-- Center Unit -->
        <div id="stage2-wrapper" class="stage2-content">
          <!-- شفاف 'e' لوگو (خالص ویکٹر - کوئی بیک گراؤنڈ نہیں) -->
          <div class="pure-e-logo">
            <svg viewBox="0 0 100 100">
              <!-- اوپر والا سفید حصہ -->
              <path d="M 50 14 C 28 14 14 30 14 47 C 14 62 27 74 48 74 C 69 74 84 62 84 46 C 84 30 70 14 50 14 Z M 50 29 C 61 29 69 37 69 46 C 69 54 60 60 49 60 C 37 60 29 53 29 45 C 29 36 38 29 50 29 Z" fill="#ffffff" />
              <!-- نیچے والا سبز قوس -->
              <path d="M 13 49 C 14 68 33 86 54 86 C 73 86 86 73 86 73 C 86 73 71 80 53 80 C 32 80 18 64 13 49 Z" fill="#00A651" />
            </svg>
          </div>

          <!-- ٹائپ رائٹر باکس -->
          <div id="typewriter-box" class="typewriter-box">
            <span id="typed-line-1" class="typewriter-line"></span>
            <span id="typed-line-2" class="typewriter-line"></span>
          </div>
        </div>

      </div>

    </div>

    <!-- 2. HOME SCREEN -->
    <div id="screen-home" class="screen" style="padding-bottom:80px;">
      <div style="background:linear-gradient(135deg, #008a43, #00A651); color:#ffffff; padding:20px; border-bottom-left-radius:28px; border-bottom-right-radius:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:24px; font-weight:900; letter-spacing:-0.05em;">easypaisa</span>
            <span style="background:#facc15; color:#1e293b; font-size:9px; font-weight:800; padding:2px 6px; border-radius:999px; text-transform:uppercase;">Bank</span>
          </div>
        </div>

        <div style="margin-top:20px; background:rgba(255,255,255,0.15); border-radius:20px; padding:16px; border:1px solid rgba(255,255,255,0.2);">
          <span style="font-size:12px; color:#ecfdf5;">Easypaisa Available Balance</span>
          <div style="font-size:26px; font-weight:900; margin-top:4px;">Rs. 7,000.00</div>
          <div style="font-size:11px; color:#ffffff; opacity:0.8; margin-top:4px;">Account: 0312-9876543</div>
        </div>
      </div>

      <div style="padding:20px;">
        <h3 style="font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:12px;">Main Services</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div style="background:#ffffff; padding:16px; border-radius:18px; border:1px solid #e2e8f0; text-align:center;">
            <div style="width:48px; height:48px; border-radius:14px; background:#dcfce7; color:#00A651; display:flex; align-items:center; justify-content:center; margin:0 auto 8px auto; font-size:18px;">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
            <span style="font-size:12px; font-weight:700; color:#334155;">Money Transfer</span>
          </div>
          <div style="background:#ffffff; padding:16px; border-radius:18px; border:1px solid #e2e8f0; text-align:center;">
            <div style="width:48px; height:48px; border-radius:14px; background:#fef3c7; color:#d97706; display:flex; align-items:center; justify-content:center; margin:0 auto 8px auto; font-size:18px;">
              <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span style="font-size:12px; font-weight:700; color:#334155;">Bill Payment</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function runSplashSequence() {
      const stage1 = document.getElementById('splash-stage-1');
      const stage2 = document.getElementById('splash-stage-2');
      const stage2Wrapper = document.getElementById('stage2-wrapper');
      const typewriterBox = document.getElementById('typewriter-box');
      const line1 = document.getElementById('typed-line-1');
      const line2 = document.getElementById('typed-line-2');

      // 1. Stage 1: Exactly 3.0 Seconds 11.jpeg Stays
      setTimeout(() => {
        stage1.style.opacity = '0';
        setTimeout(() => {
          stage1.style.display = 'none';
        }, 500);

        // 2. Stage 2: 'e' Logo appears in center
        stage2.style.opacity = '1';

        // 3. متوازن انداز میں ہلکا سا بائیں طرف موو کرے گا
        setTimeout(() => {
          stage2Wrapper.classList.add('shifted');

          // 4. موو ہوتے ہی سامنے ٹائپنگ شروع
          setTimeout(() => {
            typewriterBox.classList.add('active');

            const word1 = "digital";
            const word2 = "bank";
            let i = 0;
            let j = 0;

            const typeInterval = setInterval(() => {
              if (i < word1.length) {
                line1.innerHTML = word1.slice(0, i + 1) + '<span class="cursor-caret"></span>';
                i++;
              } else if (j < word2.length) {
                line1.innerHTML = word1;
                line2.innerHTML = word2.slice(0, j + 1) + '<span class="cursor-caret"></span>';
                j++;
              } else {
                clearInterval(typeInterval);
                line2.innerHTML = word2;

                // 5. اینیمیشن ختم ہوتے ہی سیدھا ہوم پیج
                setTimeout(() => {
                  go('screen-home');
                }, 800);
              }
            }, 130);

          }, 700);

        }, 350);

      }, 3000);
    }

    function go(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('on');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      runSplashSequence();
    });
  </script>
</body>
</html>
