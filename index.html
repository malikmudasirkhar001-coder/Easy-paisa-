<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ep-green: #00A651;
      --ep-dark-green: #008a43;
      --ep-theme-dark: #261f30;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #261f30;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      background-color: #f6f7f9;
      overflow-y: auto;
      z-index: 10;
    }
    .screen.on {
      display: flex;
    }
    .screen::-webkit-scrollbar {
      display: none;
    }

    /* SPLASH SCREEN STYLES */
    #screen-splash {
      background-color: #261f30;
      align-items: center;
      justify-content: center;
    }
    .status-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      z-index: 50;
      pointer-events: none;
    }

    /* STAGE 1: Centered 11.jpeg */
    #splash-stage-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .center-logo-box {
      width: 175px;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* STAGE 2: Slide Container */
    #splash-stage-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
    }

    .stage2-content {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(0px);
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .stage2-content.shifted {
      transform: translateX(-42px);
    }

    /* کنٹینر جہاں ریڈ بیک گراؤنڈ ریمو ہو کر نظر آئے گا */
    .red-removed-logo-box {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
      background: transparent;
    }
    .red-removed-logo-box canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .typewriter-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 170px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .typewriter-box.active {
      opacity: 1;
    }
    .typewriter-line {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
      min-height: 38px;
      letter-spacing: -0.8px;
    }

    .char-white { color: #ffffff; }
    .char-green { color: #00A651; }
    .char-gray  { color: #94a3b8; }

    /* Orbit Rings */
    .orbit-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 36s linear infinite;
      transform-origin: 250px 250px;
    }
    .orbit-ring-outer {
      animation: spinCounter 48s linear infinite;
      transform-origin: 250px 250px;
    }

    /* HOME SCREEN STYLES (MATCHING VIDEO EXACTLY) */
    .home-top-bar {
      padding: 16px 16px 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
    }
    .search-box-ello {
      flex: 1;
      height: 44px;
      background: #f1f4f8;
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }
    .ello-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .home-cards-scroll {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      overflow-x: auto;
    }
    .home-cards-scroll::-webkit-scrollbar { display: none; }

    .card-easypaisa {
      flex: 0 0 220px;
      height: 140px;
      background: linear-gradient(135deg, #00A651, #008a43);
      border-radius: 20px;
      padding: 16px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 16px rgba(0, 166, 81, 0.25);
    }
    .card-loan {
      flex: 0 0 170px;
      height: 140px;
      background: linear-gradient(135deg, #fef9c3, #fef08a);
      border-radius: 20px;
      padding: 16px;
      color: #713f12;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .services-section {
      background: #ffffff;
      margin: 8px 16px 20px 16px;
      border-radius: 24px;
      padding: 16px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .services-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 14px;
      padding-left: 6px;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      text-align: center;
    }
    .service-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .service-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #00A651;
      border: 1px solid #edf2f7;
    }
    .service-label {
      font-size: 10.5px;
      font-weight: 600;
      color: #475569;
      line-height: 1.2;
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      z-index: 50;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-btn.active { color: #00A651; }
    .nav-btn i { font-size: 18px; }
    .nav-pay-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00A651;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-top: -16px;
      box-shadow: 0 4px 12px rgba(0, 166, 81, 0.4);
    }
  </style>
</head>
<body>

  <div id="phone-frame">

    <div id="screen-splash" class="screen on">
      
      <div class="status-bar">
        <span>5:55</span>
        <div style="display:flex; gap:6px; align-items:center;">

        <div id="stage2-wrapper" class="stage2-content">
          <!-- یہاں پر سرخ بیک گراؤنڈ خودکار طور پر صاف ہو کر ظاہر ہوگا -->

      </div>

    <!-- 2. HOME SCREEN -->

      <div class="home-cards-scroll">

        <div class="card-loan">

      <div class="services-section">

        <div class="services-grid">

          <div class="service-item">

  </div>

  <script>
    /* ریڈ بیک گراؤنڈ کروما ریموور (Red Chroma Key Filter) */
    function removeRedBackgroundFromImage(src) {
      const img = new Image();
      img.src = src;
      img.onload = function() {
        const canvas = document.getElementById('red-clean-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        try {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imgData.data;

          for (let i = 0; i < d.length; i += 4) {
            const r = d[i];
            const g = d[i+1];
            const b = d[i+2];

            // اگر پکسل کا رنگ سرخ ہو (Red Chroma Key Detection)
            // یہ شرط صرف لال رنگ کو ختم کرے گی، سفید اور سبز بالکل محفوظ رہیں گے
            if (r > 120 && (r - g) > 40 && (r - b) > 40) {
              d[i+3] = 0; // سرخ رنگ مکمل ٹرانسپیرنٹ
            }
          }
          ctx.putImageData(imgData, 0, 0);
        } catch(e) {
          console.warn("Chroma filter error:", e);
        }
      };
    }

    // میٹرکس ڈیجیٹل اسکریبلنگ
    const scrambleChars = "0101Qabdeklnrtx";
    function runFastScrambleType(targetElem, finalWord, onDone) {
      let currentLen = 0;
      const speedInterval = setInterval(() => {
        if (currentLen <= finalWord.length) {
          let output = '';
          for (let i = 0; i < currentLen; i++) {
            output += `<span class="char-white">${finalWord[i]}</span>`;
          }
          if (currentLen < finalWord.length) {
            const rnd1 = scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
            const rnd2 = scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
            output += `<span class="char-green">${rnd1}</span><span class="char-gray">${rnd2}</span>`;
          }
          targetElem.innerHTML = output;
          currentLen++;
        } else {
          clearInterval(speedInterval);
          targetElem.innerHTML = `<span class="char-white">${finalWord}</span>`;
          if (onDone) onDone();
        }
      }, 55);
    }

    function runSplashSequence() {
      const stage1 = document.getElementById('splash-stage-1');
      const stage2 = document.getElementById('splash-stage-2');
      const stage2Wrapper = document.getElementById('stage2-wrapper');
      const typewriterBox = document.getElementById('typewriter-box');
      const line1 = document.getElementById('typed-line-1');
      const line2 = document.getElementById('typed-line-2');

      // 1. Stage 1: پورے 3 سیکنڈ 11.jpeg سینٹر میں رکے گی
      setTimeout(() => {
        stage1.style.opacity = '0';
        setTimeout(() => {
          stage1.style.display = 'none';
        }, 400);

        // 2. Stage 2: سرخ بیک گراؤنڈ سے صاف شدہ لوگو ظاہر ہوگا
        stage2.style.opacity = '1';

        // 3. بائیں طرف ہموار سلائیڈ
        setTimeout(() => {
          stage2Wrapper.classList.add('shifted');

          // 4. فوری تیز رفتار ٹائپنگ شروع
          setTimeout(() => {
            typewriterBox.classList.add('active');

            runFastScrambleType(line1, "digital", () => {
              runFastScrambleType(line2, "bank", () => {
                // 5. ہوم اسکرین پر روانگی
                setTimeout(() => {
                  go('screen-home');
                }, 500);
              });
            });

          }, 350);

        }, 250);

      }, 3000);
    }

    function go(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('on');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // آپ کی سرخ بیک گراؤنڈ والی تصویر کا نام (2.png)
      removeRedBackgroundFromImage('2.png');
      runSplashSequence();
    });
  </script>
</body>
