<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --ep-green: #00A651;
      --ep-dark-green: #008a43;
      --ep-theme-dark: #261f30;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: #261f30;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background-color: #f8fafc;
      overflow-y: auto;
      z-index: 10;
    }
    .screen.on {
      display: flex;
    }
    .screen::-webkit-scrollbar {
      display: none;
    }

    /* Orbit Text Animation */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 36s linear infinite;
      transform-origin: 250px 250px;
    }
    .orbit-ring-outer {
      animation: spinCounter 48s linear infinite;
      transform-origin: 250px 250px;
    }

    /* Typewriter Cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-caret {
      display: inline-block;
      width: 3px;
      height: 1.05em;
      background-color: #00A651;
      margin-left: 3px;
      animation: blink 0.5s infinite;
      vertical-align: middle;
    }

    .brand-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    .key-btn {
      touch-action: manipulation;
      transition: all 0.1s ease-in-out;
    }
    .key-btn:active {
      transform: scale(0.92);
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Audio asset for payment success voice -->
  <audio id="voice" preload="auto">
    <source src="./1.mp3" type="audio/mpeg">
  </audio>

  <!-- Mobile Frame -->
  <div id="phone-frame">

    <!-- Notification Toast -->
    <div id="toast-banner" class="hidden absolute top-4 left-4 right-4 z-50 bg-slate-900/95 text-white p-3.5 rounded-2xl shadow-2xl border border-slate-700/80 transition-all duration-300 flex items-start gap-3">
      <div id="toast-icon" class="w-8 h-8 rounded-full bg-[#00A651] flex items-center justify-center text-white shrink-0 mt-0.5">
        <i class="fa-solid fa-bell text-sm"></i>
      </div>
      <div class="flex-1 text-xs">
        <h4 id="toast-title" class="font-bold text-white tracking-wide">Notification</h4>
        <p id="toast-msg" class="text-slate-300 mt-0.5 leading-snug">Notice details</p>
      </div>
      <button onclick="hideToast()" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 1. SPLASH SCREEN -->
    <div id="screen-splash" class="screen on !bg-[#261f30] items-center justify-center select-none overflow-hidden relative">
      
      <!-- Top Status Bar -->
      <div class="absolute top-3 inset-x-5 flex justify-between items-center text-[11px] text-white/50 font-semibold z-30">
        <span>5:55</span>
        <div class="flex items-center gap-1.5 text-[10px]">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <span>84%</span>
        </div>
      </div>

      <!-- STAGE 1: Exact Centered 1.png (Fixed 3 Seconds, No click-skip) -->
      <div id="splash-stage-1" class="absolute inset-0 flex items-center justify-center z-20 transition-opacity duration-700">
        <div class="w-40 h-40 flex items-center justify-center p-2">
          <!-- 1.png Path: Includes automatic fallback so screen never stays blank -->
          <img id="img-first" src="1.png" alt="Easypaisa First Logo" 
               class="max-w-full max-h-full object-contain pointer-events-none drop-shadow-xl"
               onerror="this.onerror=null; this.src='https://i.ibb.co/Lh0H11BY/138526.png';">
        </div>
      </div>

      <!-- STAGE 2: 2.png on Left + Big Typewriter on Right + Outer Distant Rings -->
      <div id="splash-stage-2" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-700 z-10">
        
        <!-- Rotating Text Rings (Distant from Center) -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 500 500">
          <defs>
            <path id="innerCirclePath" d="M 250, 250 m -165, 0 a 165,165 0 1,1 330,0 a 165,165 0 1,1 -330,0" fill="none" />
            <path id="outerCirclePath" d="M 250, 250 m -225, 0 a 225,225 0 1,1 450,0 a 225,225 0 1,1 -450,0" fill="none" />
          </defs>

          <!-- Inner Ring -->
          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="500" letter-spacing="3.5">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <!-- Outer Ring -->
          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Space Grotesk', sans-serif" font-size="15.5" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>

        <!-- Center Unit: 2.png on Left + Digital Bank Typewriter on Right -->
        <div class="relative z-20 flex items-center justify-center px-4">
          <!-- 2.png Path: Left-side positioned -->
          <div class="w-16 h-16 shrink-0 flex items-center justify-center mr-3.5">
            <img id="img-second" src="2.png" alt="Easypaisa Second Logo" 
                 class="max-w-full max-h-full object-contain drop-shadow-md pointer-events-none"
                 onerror="this.onerror=null; this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5m42bkv91DtBj9AXA3R104H_yaItfi63HEg&s';">
          </div>

          <!-- Typewriter Output -->
          <div class="flex flex-col justify-center leading-none text-left">
            <span id="typed-line-1" class="text-white text-[32px] font-black tracking-tight brand-font block mb-1 min-h-[38px]"></span>
            <span id="typed-line-2" class="text-white text-[32px] font-black tracking-tight brand-font block min-h-[38px]"></span>
          </div>
        </div>

      </div>

    </div>

    <!-- 2. LOGIN SCREEN (Opens directly after splash sequence finishes) -->
    <div id="screen-login" class="screen justify-between p-6 bg-white">
      <div class="flex items-center justify-between pt-4">
        <div class="w-8"></div>
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Secure Sign In</span>
        <div class="w-8"></div>
      </div>

      <div class="flex flex-col items-center justify-center py-4">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#008a43] to-[#00A651] flex items-center justify-center text-white shadow-lg mb-3">
          <i class="fa-solid fa-lock text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800">Enter Your 5-Digit PIN</h2>
        <p class="text-xs text-slate-500 mt-1">Easypaisa Account: 0312-9876543</p>

        <!-- PIN Dots indicator -->
        <div class="flex items-center gap-3.5 mt-6 mb-2">
          <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-4" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
        </div>
        <span id="pin-feedback" class="text-xs font-semibold text-rose-500 h-4 text-center"></span>
      </div>

      <!-- Keypad -->
      <div class="grid grid-cols-3 gap-3 pb-4 max-w-xs mx-auto w-full">
        <button onclick="pin('1')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">1</button>
        <button onclick="pin('2')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">2</button>
        <button onclick="pin('3')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">3</button>
        <button onclick="pin('4')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">4</button>
        <button onclick="pin('5')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">5</button>
        <button onclick="pin('6')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">6</button>
        <button onclick="pin('7')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">7</button>
        <button onclick="pin('8')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">8</button>
        <button onclick="pin('9')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">9</button>
        <button onclick="pinClear()" class="key-btn h-14 rounded-2xl bg-slate-100 text-xs font-bold text-slate-600 border border-slate-200/60">CLR</button>
        <button onclick="pin('0')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">0</button>
        <button onclick="pinDel()" class="key-btn h-14 rounded-2xl bg-slate-100 text-lg font-bold text-slate-600 border border-slate-200/60">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>
    </div>

    <!-- 3. HOME SCREEN -->
    <div id="screen-home" class="screen pb-20">
      <div class="bg-gradient-to-r from-[#008a43] to-[#00A651] text-white p-5 rounded-b-3xl shadow-md">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-2xl tracking-tighter">easypaisa</span>
            <span class="bg-[#facc15] text-[#2d2a3e] text-[9px] font-extrabold px-1.5 py-0.5 rounded-full uppercase">Bank</span>
          </div>
          <div class="flex items-center gap-3 text-lg">
            <button onclick="showToast('Customer Care', 'Helpline 3737 is 24/7 available.')" class="p-1 hover:text-emerald-100"><i class="fa-solid fa-headset"></i></button>
            <button onclick="auth('screen-profile')" class="p-1 hover:text-emerald-100"><i class="fa-regular fa-circle-user"></i></button>
          </div>
        </div>

        <div class="flex items-center justify-between mt-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-sm shrink-0 bg-white">
              <img id="avatar-img-home" src="https://placehold.co/120x120/00A651/ffffff?text=Ayesha" alt="Ayesha Avatar" class="w-full h-full object-cover">
            </div>
            <div>
              <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
                Ayesha <i class="fa-solid fa-shield-halved text-xs text-yellow-300"></i>
              </h1>
              <span class="inline-flex items-center gap-1 bg-white/20 text-[10px] font-semibold px-2 py-0.5 rounded-full text-white mt-1">
                <i class="fa-solid fa-gift text-yellow-300"></i> Rewards
              </span>
            </div>
          </div>
        </div>

        <!-- Balance Panel -->
        <div class="mt-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20">
          <div class="flex items-center justify-between">
            <span class="text-xs text-emerald-100 font-medium">Easypaisa Available Balance</span>
            <button onclick="toggleBalanceMask()" class="text-xs text-white/80 hover:text-white">
              <i id="eye-icon" class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="flex items-baseline gap-1 mt-1">
            <span class="text-sm font-semibold text-white/90">Rs.</span>
            <span id="display-balance" class="text-2xl font-black text-white tracking-tight">7,000.00</span>
          </div>
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-white/10 text-[11px] text-white/80">
            <span>Account: 0312-9876543</span>
            <span class="text-yellow-300 font-bold hover:underline cursor-pointer" onclick="go('screen-statement')">View Ledger &rarr;</span>
          </div>
        </div>
      </div>

      <!-- Services Grid -->
      <div class="p-5">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Main Services</h3>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="auth('screen-transfer')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition">
            <div class="w-12 h-12 rounded-2xl bg-[#dcfce7] text-[#00A651] flex items-center justify-center text-xl mb-2">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
            <span class="text-xs font-bold text-slate-700 leading-tight">Money Transfer</span>
          </button>

          <button onclick="auth('screen-bills')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl mb-2">
              <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span class="text-xs font-bold text-slate-700 leading-tight">Bill Payment</span>
          </button>

          <button onclick="auth('screen-statement')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition">
            <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl mb-2">
              <i class="fa-solid fa-receipt"></i>
            </div>
            <span class="text-xs font-bold text-slate-700 leading-tight">Statement</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 4. MONEY TRANSFER SCREEN -->
    <div id="screen-transfer" class="screen p-5 bg-white">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <button onclick="go('screen-home')" class="text-slate-400 hover:text-slate-700 p-2"><i class="fa-solid fa-arrow-left"></i></button>
        <h3 class="font-bold text-slate-800 text-sm">Send Money</h3>
        <div class="w-8"></div>
      </div>

      <div class="mt-5 space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1.5">Recipient Mobile / Account Number</label>
          <input type="tel" id="transfer-number" placeholder="e.g. 03001234567" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-[#00A651]">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1.5">Amount (PKR)</label>
          <input type="number" id="transfer-amount" placeholder="Min. Rs 1 - Max. Rs 50,000" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-base font-bold text-slate-800 focus:outline-none focus:border-[#00A651]">
        </div>
      </div>

      <div class="mt-auto pb-4">
        <button onclick="executeQuickSend()" class="w-full bg-[#00A651] hover:bg-[#008a43] text-white py-3.5 rounded-2xl font-bold text-sm shadow-md transition">
          Send Money
        </button>
      </div>
    </div>

    <!-- 5. STATEMENT SCREEN -->
    <div id="screen-statement" class="screen p-5 bg-slate-50 pb-20">
      <div class="flex items-center justify-between pb-4 border-b border-slate-200">
        <button onclick="go('screen-home')" class="text-slate-400 hover:text-slate-700 p-2"><i class="fa-solid fa-arrow-left"></i></button>
        <h3 class="font-bold text-slate-800 text-sm">Account Statement</h3>
        <div class="w-8"></div>
      </div>
      <div class="mt-4 bg-slate-900 rounded-2xl p-4 text-white">
        <span class="text-xs text-slate-400">Current Balance</span>
        <h3 class="text-xl font-bold mt-1">Rs. <span id="statement-balance">7,000.00</span></h3>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="hidden absolute bottom-0 inset-x-0 h-16 bg-white border-t border-slate-100 flex items-center justify-around px-2 z-30 shadow-lg">
      <button onclick="go('screen-home')" class="flex flex-col items-center justify-center text-[#00A651] w-12 py-1">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] font-semibold mt-1">Home</span>
      </button>
      <button onclick="auth('screen-statement')" class="flex flex-col items-center justify-center text-slate-400 hover:text-[#00A651] w-12 py-1">
        <i class="fa-solid fa-clock-rotate-left text-base"></i>
        <span class="text-[10px] font-semibold mt-1">History</span>
      </button>
      <button onclick="auth('screen-transfer')" class="flex flex-col items-center justify-center text-slate-400 hover:text-[#00A651] w-12 py-1">
        <i class="fa-solid fa-paper-plane text-base"></i>
        <span class="text-[10px] font-semibold mt-1">Send</span>
      </button>
    </nav>

  </div>

  <script>
    let walletBalance = 7000.00;
    let logged = false;
    let pinStr = '';
    let balanceMasked = false;

    /* Splash Sequence Handler */
    function runSplashSequence() {
      const stage1 = document.getElementById('splash-stage-1');
      const stage2 = document.getElementById('splash-stage-2');
      const line1 = document.getElementById('typed-line-1');
      const line2 = document.getElementById('typed-line-2');

      // 1. Stage 1: Stays exactly 3.0 Seconds (3000ms)
      setTimeout(() => {
        stage1.classList.add('opacity-0');
        setTimeout(() => stage1.classList.add('hidden'), 600);

        // 2. Stage 2: Reveal 2.png + Circular Rings + Typewriter
        stage2.classList.remove('opacity-0', 'pointer-events-none');
        stage2.classList.add('opacity-100');

        const word1 = "digital";
        const word2 = "bank";
        let i = 0;
        let j = 0;

        const typeInterval = setInterval(() => {
          if (i < word1.length) {
            line1.innerHTML = word1.slice(0, i + 1) + '<span class="cursor-caret"></span>';
            i++;
          } else if (j < word2.length) {
            line1.innerHTML = word1;
            line2.innerHTML = word2.slice(0, j + 1) + '<span class="cursor-caret"></span>';
            j++;
          } else {
            clearInterval(typeInterval);
            line2.innerHTML = word2; // Complete

            // 3. Wait 3 seconds after text finishes, then navigate to LOGIN
            setTimeout(() => {
              go('screen-login');
            }, 3000);
          }
        }, 130);

      }, 3000);
    }

    function go(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('on');
      }

      updateBalanceUI();

      const bottomNav = document.getElementById('bottom-nav');
      if (logged && screenId !== 'screen-splash' && screenId !== 'screen-login') {
        bottomNav.classList.remove('hidden');
      } else {
        bottomNav.classList.add('hidden');
      }
    }

    function auth(screenId) {
      if (!logged) {
        go('screen-login');
      } else {
        go(screenId);
      }
    }

    /* PIN verification */
    function pin(val) {
      if (pinStr.length >= 5) return;
      pinStr += val;
      updatePinDots();

      if (pinStr.length === 5) {
        setTimeout(verifyPin, 180);
      }
    }

    function pinDel() {
      if (pinStr.length > 0) {
        pinStr = pinStr.slice(0, -1);
        updatePinDots();
        document.getElementById('pin-feedback').innerText = '';
      }
    }

    function pinClear() {
      pinStr = '';
      updatePinDots();
      document.getElementById('pin-feedback').innerText = '';
    }

    function updatePinDots() {
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < pinStr.length) {
          dot.classList.add('bg-[#00A651]', 'border-[#00A651]');
          dot.classList.remove('bg-transparent', 'border-slate-300');
        } else {
          dot.classList.remove('bg-[#00A651]', 'border-[#00A651]');
          dot.classList.add('bg-transparent', 'border-slate-300');
        }
      }
    }

    function verifyPin() {
      const feedback = document.getElementById('pin-feedback');

      if (pinStr === '32303') {
        logged = true;
        pinClear();
        showToast('Login Successful', 'Welcome back!');
        go('screen-home');
        return;
      }

      feedback.innerText = 'Incorrect PIN. Try 32303';
      setTimeout(() => {
        pinClear();
      }, 700);
    }

    function updateBalanceUI() {
      const formatted = Number(walletBalance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const displayElem = document.getElementById('display-balance');
      const stmtElem = document.getElementById('statement-balance');

      if (displayElem) {
        displayElem.innerText = balanceMasked ? '••••••••' : formatted;
      }
      if (stmtElem) {
        stmtElem.innerText = formatted;
      }
    }

    function toggleBalanceMask() {
      balanceMasked = !balanceMasked;
      const eye = document.getElementById('eye-icon');
      if (balanceMasked) {
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
      updateBalanceUI();
    }

    function showToast(title, msg) {
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-title').innerText = title;
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    function hideToast() {
      document.getElementById('toast-banner').classList.add('hidden');
    }

    function executeQuickSend() {
      const amt = parseFloat(document.getElementById('transfer-amount').value);
      if (isNaN(amt) || amt <= 0) {
        showToast('Error', 'Valid amount darj karein.');
        return;
      }
      if (amt > walletBalance) {
        showToast('Balance Kam Hai', 'Account mein raqam na-kaafi hai.');
        return;
      }
      walletBalance -= amt;
      updateBalanceUI();
      showToast('Transferred', `Rs. ${amt} transfer ho gaye.`);
      go('screen-home');
    }

    // App Init
    window.addEventListener('DOMContentLoaded', () => {
      updateBalanceUI();
      runSplashSequence();
    });
  </script>
</body>
</html>
