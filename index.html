<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easypaisa</title>
  
  <!-- Fonts & CDN Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --ep-green: #00A651;
      --ep-dark-green: #008a43;
      --ep-splash-bg: #261f30;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: #261f30;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
      overflow: hidden;
    }
    #phone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 860px;
      background: #261f30;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      #phone-frame {
        border-radius: 42px;
        border: 8px solid #1a1522;
        height: 840px;
      }
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background-color: #f8fafc;
      overflow-y: auto;
      z-index: 10;
    }
    .screen.on {
      display: flex;
    }
    .screen::-webkit-scrollbar {
      display: none;
    }

    /* Outer Text Circular Rotation */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring-inner {
      animation: spinClockwise 36s linear infinite;
      transform-origin: 250px 250px;
    }
    .orbit-ring-outer {
      animation: spinCounter 48s linear infinite;
      transform-origin: 250px 250px;
    }

    /* Typewriter Blinking Cursor */
    @keyframes cursorPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-caret {
      display: inline-block;
      width: 3.5px;
      height: 0.95em;
      background-color: #00A651;
      margin-left: 3px;
      animation: cursorPulse 0.5s infinite;
      vertical-align: middle;
    }

    .brand-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    .key-btn {
      touch-action: manipulation;
      transition: all 0.1s ease-in-out;
    }
    .key-btn:active {
      transform: scale(0.92);
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Audio asset for payment success voice -->
  <audio id="voice" preload="auto">
    <source src="./1.mp3" type="audio/mpeg">
  </audio>

  <!-- Mobile Frame -->
  <div id="phone-frame">

    <!-- 1. SPLASH SCREEN -->
    <div id="screen-splash" class="screen on !bg-[#261f30] items-center justify-center select-none overflow-hidden relative">
      
      <!-- Top Mobile Status Bar -->
      <div class="absolute top-3 inset-x-5 flex justify-between items-center text-[11px] text-white/50 font-semibold z-30 pointer-events-none">
        <span>5:55</span>
        <div class="flex items-center gap-1.5 text-[10px]">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <span>84%</span>
        </div>
      </div>

      <!-- STAGE 1: Exact Centered Box containing 11.png (3 Seconds Strict Stay) -->
      <div id="splash-stage-1" class="absolute inset-0 flex items-center justify-center z-20 transition-opacity duration-700 pointer-events-none">
        <!-- White Square Box Container -->
        <div class="w-36 h-36 bg-white rounded-3xl flex items-center justify-center shadow-2xl p-4 overflow-hidden border border-white/10">
          <img id="img-11" src="11.png" alt="Easypaisa Logo 1" class="w-full h-full object-contain pointer-events-none block">
        </div>
      </div>

      <!-- STAGE 2: Left-side Box (2.png) + Typewriter Text (digital bank) + Outer Rings -->
      <div id="splash-stage-2" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-700 z-10">
        
        <!-- Distant Rotating Concentric Text Rings -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 500 500">
          <defs>
            <path id="innerCirclePath" d="M 250, 250 m -165, 0 a 165,165 0 1,1 330,0 a 165,165 0 1,1 -330,0" fill="none" />
            <path id="outerCirclePath" d="M 250, 250 m -225, 0 a 225,225 0 1,1 450,0 a 225,225 0 1,1 -450,0" fill="none" />
          </defs>

          <!-- Inner Orbit -->
          <g class="orbit-ring-inner">
            <text fill="#ffffff" fill-opacity="0.85" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="500" letter-spacing="3.5">
              <textPath href="#innerCirclePath" startOffset="0%">
                is now a digital bank · easypaisa · is now a digital bank ·
              </textPath>
            </text>
          </g>

          <!-- Outer Orbit -->
          <g class="orbit-ring-outer">
            <text fill="#ffffff" fill-opacity="0.65" font-family="'Space Grotesk', sans-serif" font-size="15.5" font-weight="500" letter-spacing="4.8">
              <textPath href="#outerCirclePath" startOffset="0%">
                skip going to the bank - skip going to the bank -
              </textPath>
            </text>
          </g>
        </svg>

        <!-- Center Unit: Left Side Box for 2.png + Right Side Typewriter Text -->
        <div class="relative z-20 flex items-center justify-center px-4">
          <!-- Left Side White Box for 2.png -->
          <div class="w-16 h-16 shrink-0 bg-transparent rounded-2xl flex items-center justify-center mr-3.5 overflow-hidden">
            <img id="img-2" src="2.png" alt="Easypaisa Logo 2" class="w-full h-full object-contain pointer-events-none block drop-shadow-md">
          </div>

          <!-- Typewriter Output (digital bank) -->
          <div class="flex flex-col justify-center leading-none text-left min-w-[170px]">
            <span id="typed-line-1" class="text-white text-[32px] font-black tracking-tight brand-font block mb-1 min-h-[38px]"></span>
            <span id="typed-line-2" class="text-white text-[32px] font-black tracking-tight brand-font block min-h-[38px]"></span>
          </div>
        </div>

      </div>

    </div>

    <!-- 2. LOGIN SCREEN (Opens directly after splash sequence finishes) -->
    <div id="screen-login" class="screen justify-between p-6 bg-white">
      <div class="flex items-center justify-between pt-4">
        <div class="w-8"></div>
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Secure Sign In</span>
        <div class="w-8"></div>
      </div>

      <div class="flex flex-col items-center justify-center py-4">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#008a43] to-[#00A651] flex items-center justify-center text-white shadow-lg mb-3">
          <i class="fa-solid fa-lock text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800">Enter Your 5-Digit PIN</h2>
        <p class="text-xs text-slate-500 mt-1">Easypaisa Account: 0312-9876543</p>

        <!-- PIN Dots indicator -->
        <div class="flex items-center gap-3.5 mt-6 mb-2">
          <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
          <div id="dot-4" class="w-4 h-4 rounded-full border-2 border-slate-300 bg-transparent transition-all"></div>
        </div>
        <span id="pin-feedback" class="text-xs font-semibold text-rose-500 h-4 text-center"></span>
      </div>

      <!-- Keypad -->
      <div class="grid grid-cols-3 gap-3 pb-4 max-w-xs mx-auto w-full">
        <button onclick="pin('1')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">1</button>
        <button onclick="pin('2')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">2</button>
        <button onclick="pin('3')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">3</button>
        <button onclick="pin('4')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">4</button>
        <button onclick="pin('5')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">5</button>
        <button onclick="pin('6')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">6</button>
        <button onclick="pin('7')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">7</button>
        <button onclick="pin('8')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">8</button>
        <button onclick="pin('9')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">9</button>
        <button onclick="pinClear()" class="key-btn h-14 rounded-2xl bg-slate-100 text-xs font-bold text-slate-600 border border-slate-200/60">CLR</button>
        <button onclick="pin('0')" class="key-btn h-14 rounded-2xl bg-slate-50 text-xl font-bold text-slate-800 shadow-xs border border-slate-200/60">0</button>
        <button onclick="pinDel()" class="key-btn h-14 rounded-2xl bg-slate-100 text-lg font-bold text-slate-600 border border-slate-200/60">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>
    </div>

    <!-- 3. HOME SCREEN -->
    <div id="screen-home" class="screen pb-20">
      <div class="bg-gradient-to-r from-[#008a43] to-[#00A651] text-white p-5 rounded-b-3xl shadow-md">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-2xl tracking-tighter">easypaisa</span>
            <span class="bg-[#facc15] text-[#2d2a3e] text-[9px] font-extrabold px-1.5 py-0.5 rounded-full uppercase">Bank</span>
          </div>
        </div>

        <div class="flex items-center justify-between mt-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-sm shrink-0 bg-white">
              <img src="https://placehold.co/120x120/00A651/ffffff?text=Ayesha" alt="Ayesha" class="w-full h-full object-cover">
            </div>
            <div>
              <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
                Ayesha <i class="fa-solid fa-shield-halved text-xs text-yellow-300"></i>
              </h1>
            </div>
          </div>
        </div>

        <!-- Balance Panel -->
        <div class="mt-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20">
          <span class="text-xs text-emerald-100 font-medium">Easypaisa Available Balance</span>
          <div class="flex items-baseline gap-1 mt-1">
            <span class="text-sm font-semibold text-white/90">Rs.</span>
            <span id="display-balance" class="text-2xl font-black text-white tracking-tight">7,000.00</span>
          </div>
        </div>
      </div>

      <div class="p-5">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Main Services</h3>
        <div class="grid grid-cols-2 gap-3">
          <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
            <div class="w-12 h-12 rounded-2xl bg-[#dcfce7] text-[#00A651] flex items-center justify-center text-xl mb-2">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
            <span class="text-xs font-bold text-slate-700">Money Transfer</span>
          </button>
          <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl mb-2">
              <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span class="text-xs font-bold text-slate-700">Bill Payment</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let walletBalance = 7000.00;
    let pinStr = '';

    /* STRICT SPLASH ANIMATION CONTROLLER */
    function runSplashSequence() {
      const stage1 = document.getElementById('splash-stage-1');
      const stage2 = document.getElementById('splash-stage-2');
      const line1 = document.getElementById('typed-line-1');
      const line2 = document.getElementById('typed-line-2');

      // 1. Stage 1: Exactly 3.0 Seconds (3000ms) Stays without Skipping
      setTimeout(() => {
        stage1.classList.add('opacity-0');
        setTimeout(() => {
          stage1.style.display = 'none';
        }, 600);

        // 2. Stage 2: Reveal Left Box (2.png) + Rings + Typewriter
        stage2.classList.remove('opacity-0', 'pointer-events-none');
        stage2.classList.add('opacity-100');

        const word1 = "digital";
        const word2 = "bank";
        let i = 0;
        let j = 0;

        const typeInterval = setInterval(() => {
          if (i < word1.length) {
            line1.innerHTML = word1.slice(0, i + 1) + '<span class="cursor-caret"></span>';
            i++;
          } else if (j < word2.length) {
            line1.innerHTML = word1;
            line2.innerHTML = word2.slice(0, j + 1) + '<span class="cursor-caret"></span>';
            j++;
          } else {
            clearInterval(typeInterval);
            line2.innerHTML = word2; // Typing Finished

            // 3. Exactly 1.5 Seconds pause after typing, then go directly to LOGIN SCREEN
            setTimeout(() => {
              go('screen-login');
            }, 1500);
          }
        }, 130);

      }, 3000); // 3000ms strict stay for stage 1
    }

    function go(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('on');
      }
    }

    /* PIN verification */
    function pin(val) {
      if (pinStr.length >= 5) return;
      pinStr += val;
      updatePinDots();

      if (pinStr.length === 5) {
        setTimeout(verifyPin, 180);
      }
    }

    function pinDel() {
      if (pinStr.length > 0) {
        pinStr = pinStr.slice(0, -1);
        updatePinDots();
        document.getElementById('pin-feedback').innerText = '';
      }
    }

    function pinClear() {
      pinStr = '';
      updatePinDots();
      document.getElementById('pin-feedback').innerText = '';
    }

    function updatePinDots() {
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < pinStr.length) {
          dot.classList.add('bg-[#00A651]', 'border-[#00A651]');
          dot.classList.remove('bg-transparent', 'border-slate-300');
        } else {
          dot.classList.remove('bg-[#00A651]', 'border-[#00A651]');
          dot.classList.add('bg-transparent', 'border-slate-300');
        }
      }
    }

    function verifyPin() {
      const feedback = document.getElementById('pin-feedback');

      if (pinStr === '32303') {
        pinClear();
        go('screen-home');
        return;
      }

      feedback.innerText = 'Incorrect PIN. Try 32303';
      setTimeout(() => {
        pinClear();
      }, 700);
    }

    // Initialize animation immediately
    window.addEventListener('DOMContentLoaded', () => {
      runSplashSequence();
    });
  </script>
</body>
</html>
